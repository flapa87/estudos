<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma INSS - Plano de Estudos Interativo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-blue: #1e3a8a;
            --secondary-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }
        
        body {
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #1e40af 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        
        .background-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 20px;
            position: relative;
        }
        
        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        
        .inss-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 24px;
            color: #1e3a8a;
            box-shadow: 0 10px 30px rgba(251, 191, 36, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .inss-logo::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255,255,255,0.1) 10px,
                rgba(255,255,255,0.1) 20px
            );
        }
        
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-top: 10px;
            color: #94a3b8;
        }
        
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px 30px;
            text-align: center;
            min-width: 150px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            font-family: 'Montserrat', sans-serif;
            color: #fbbf24;
        }
        
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 5px;
        }
        
        .week-section {
            margin-bottom: 50px;
            opacity: 0;
            animation: fadeInUp 0.6s forwards;
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
            from {
                opacity: 0;
                transform: translateY(30px);
            }
        }
        
        .week-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding: 0 10px;
        }
        
        .week-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            text-transform: uppercase;
            display: flex;
            align-items: baseline;
            gap: 15px;
        }
        
        .week-number {
            color: #fbbf24;
            font-size: 3rem;
        }
        
        .week-progress {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--glass-bg);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
        }
        
        .progress-bar {
            width: 150px;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #34d399);
            border-radius: 5px;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
        
        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
        }
        
        .day-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 15px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .day-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            transform: scaleX(0);
            transition: transform 0.3s;
        }
        
        .day-card:hover::before {
            transform: scaleX(1);
        }
        
        .day-card.completed {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.3);
        }
        
        .day-card.completed::before {
            background: linear-gradient(90deg, #10b981, #34d399);
            transform: scaleX(1);
        }
        
        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .day-number {
            font-weight: 700;
            font-size: 0.9rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .day-check {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            background: transparent;
        }
        
        .day-check:hover {
            border-color: #10b981;
            transform: scale(1.1);
        }
        
        .day-check.checked {
            background: #10b981;
            border-color: #10b981;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }
        
        .day-check.checked::after {
            content: '✓';
            color: white;
            font-weight: bold;
            font-size: 16px;
        }
        
        .subjects-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .subject-item {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 10px;
            font-size: 0.8rem;
            position: relative;
            transition: all 0.3s;
        }
        
        .subject-item:hover {
            background: rgba(0,0,0,0.3);
            transform: translateX(5px);
        }
        
        .subject-name {
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.3;
            color: #e2e8f0;
        }
        
        .subject-icons {
            display: flex;
            gap: 8px;
            justify-content: flex-start;
        }
        
        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s;
            position: relative;
            background: rgba(255,255,255,0.1);
        }
        
        .icon-btn:hover {
            transform: scale(1.15);
        }
        
        .icon-btn.video {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }
        
        .icon-btn.video:hover, .icon-btn.video.active {
            background: #ef4444;
            color: white;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }
        
        .icon-btn.book {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
        }
        
        .icon-btn.book:hover, .icon-btn.book.active {
            background: #10b981;
            color: white;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
        
        .icon-btn.quiz {
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
        }
        
        .icon-btn.quiz:hover, .icon-btn.quiz.active {
            background: #3b82f6;
            color: white;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }
        
        .count-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #fbbf24;
            color: #1e3a8a;
            font-size: 0.7rem;
            font-weight: 800;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s;
        }
        
        .icon-btn.active .count-badge {
            opacity: 1;
            transform: scale(1);
        }
        
        .revision-day {
            grid-column: span 1;
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(245, 158, 11, 0.1));
            border: 2px dashed rgba(251, 191, 36, 0.3);
        }
        
        .revision-day .day-number {
            color: #fbbf24;
        }
        
        .revision-day .subject-name {
            color: #fbbf24;
            font-weight: 700;
            text-align: center;
            font-size: 1rem;
        }
        
        .floating-actions {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
        }
        
        .fab {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .fab-primary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
        }
        
        .fab-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            font-size: 20px;
        }
        
        .fab:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 6px 30px rgba(0,0,0,0.4);
        }
        
        .tooltip {
            position: fixed;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
            white-space: nowrap;
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            animation: confetti-fall 3s linear forwards;
        }
        
        @keyframes confetti-fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: linear-gradient(135deg, #1e3a8a, #1e40af);
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .modal h2 {
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 20px;
            color: #fbbf24;
        }
        
        .modal p {
            margin-bottom: 30px;
            line-height: 1.6;
            opacity: 0.9;
        }
        
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        
        .btn {
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 1rem;
        }
        
        .btn-primary {
            background: #10b981;
            color: white;
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .week-title { font-size: 1.8rem; }
            .week-number { font-size: 2.2rem; }
            .days-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
            .stat-card { min-width: 120px; padding: 15px 20px; }
            .stat-number { font-size: 2rem; }
        }
        
        .streak-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-left: 10px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="background-pattern"></div>
    <div class="tooltip" id="tooltip"></div>
    
    <div class="container">
        <header>

            <p class="subtitle">Cronograma de Estudos Interativo - 5 Semanas</p>

                <div class="stat-card">

                <div class="stat-card">
                    <div class="stat-number" id="completionRate">0%</div>
                    <div class="stat-label">Conclusão</div>
                </div>
            </div>
        </header>

        <div id="weeksContainer"></div>
    </div>

    <div class="floating-actions">
        <button class="fab fab-danger" onclick="confirmReset()" title="Resetar Progresso">↺</button>
        <button class="fab fab-primary" onclick="scrollToToday()" title="Ir para Hoje">📅</button>
    </div>

    <div class="modal" id="resetModal">

            <h2>⚠️ Resetar Progresso</h2>

            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="resetProgress()">Sim, Resetar</button>
            </div>
        </div>
    </div>

                    { day: 22, subjects: [
                        { name: "Direito Previdenciário - Revisão e revisão dos benefícios", icons: ["video", "book", "quiz"] },
                        { name: "Língua Portuguesa - Ortografia oficial", icons: ["video", "book", "quiz"] }
                    ]},
                    { day: 23, subjects: [
                        { name: "Direito Previdenciário - Prescrição e decadência", icons: ["video", "book", "quiz"] },
                        { name: "Raciocínio Lógico - Diagramas lógicos", icons: ["video", "book", "quiz"] }
                    ]},
                    { day: 24, subjects: [
                        { name: "Direito Previdenciário - Processo administrativo previdenciário", icons: ["video", "book", "quiz"] },
                        { name: "Informática - Microsoft Word: edição e formatação", icons: ["video", "book", "quiz"] }
                    ]},
                    { day: 25, subjects: [
                        { name: "Direito Previdenciário - Ações judiciais previdenciárias", icons: ["video", "book", "quiz"] },
                        { name: "Direito Administrativo - Atos administrativos: requisitos e classificação", icons: ["video", "book", "quiz"] }
                    ]},
                    { day: 26, subjects: [
                        { name: "Direito Constitucional - Controle de constitucionalidade", icons: ["video", "book", "quiz"] },
                        { name: "Língua Portuguesa - Regência verbal e nominal", icons: ["video", "book", "quiz"] }
                    ]},
                    { day: 27, subjects: [
                        { name: "Direito Administrativo - Poderes administrativos", icons: ["video", "book", "quiz"] },
                        { name: "Raciocínio Lógico - Problemas de lógica matemática", icons: ["video", "book", "quiz"] }
                    ]},
                    { day: 28, subjects: [{ name: "REVISÃO SEMANAL", icons: [], isRevision: true }]}
                ]
            },
            {
                week: 5,
                days: [
                    { day: 29, subjects: [
                        { name: "Direito Administrativo - Agentes públicos: conceito e classificação", icons: ["video", "book", "quiz"] },
                        { name: "Língua Portuguesa - Figuras de linguagem", icons: ["video", "book", "quiz"] }
                    ]},
                    { day: 30, subjects: [
                        { name: "Raciocínio Lógico - Sequências lógicas", icons: ["video", "book", "quiz"] },
                        { name: "Informática - Microsoft Excel: fórmulas e funções", icons: ["video", "book", "quiz"] }
                    ]},
                    { day: 31, subjects: [
                        { name: "Língua Portuguesa - Coesão textual e elementos de coesão", icons: ["video", "book", "quiz"] },
                        { name: "Raciocínio Lógico - Estatística básica", icons: ["video", "book", "quiz"] }
                    ]},
                    { day: 32, subjects: [
                        { name: "Língua Portuguesa - Tipos de discurso e funções da linguagem", icons: ["video", "book", "quiz"] },
                        { name: "Raciocínio Lógico - Probabilidade e combinatória", icons: ["video", "book", "quiz"] }
                    ]},
                    { day: 33, subjects: [
                        { name: "Língua Portuguesa - Gêneros textuais", icons: ["video", "book", "quiz"] },
                        { name: "Direito Constitucional - Direitos sociais e tutela do meio ambiente", icons: ["video", "book", "quiz"] }
                    ]},
                    { day: 34, subjects: [{ name: "REVISÃO SEMANAL", icons: [], isRevision: true }]}
                ]
            }
        ];

        // Estado da aplicação
        let studyData = JSON.parse(localStorage.getItem('inssStudyData')) || {};
        
        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            renderSchedule();
            updateStats();
            setupTooltip();
        });

        function renderSchedule() {
            const container = document.getElementById('weeksContainer');
            
            scheduleData.forEach((week, weekIndex) => {
                const weekSection = document.createElement('div');
                weekSection.className = 'week-section';
                weekSection.style.animationDelay = `${weekIndex * 0.1}s`;
                
                const completedDays = week.days.filter(d => studyData[d.day]?.completed).length;
                const progress = (completedDays / week.days.length) * 100;
                
                weekSection.innerHTML = `
                    <div class="week-header">
                        <div class="week-title">
                            Semana <span class="week-number">${week.week}</span>
                            ${getStreakIndicator(week.days)}
                        </div>
                        <div class="week-progress">
                            <span>${Math.round(progress)}%</span>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%"></div>
                            </div>
                        </div>
                    </div>
                    <div class="days-grid">
                        ${week.days.map(day => renderDayCard(day)).join('')}
                    </div>
                `;
                
                container.appendChild(weekSection);
            });
        }

        function getStreakIndicator(days) {
            const streak = days.filter(d => studyData[d.day]?.completed).length;
            if (streak === days.length) {
                return '<span class="streak-indicator">✨ Completo!</span>';
            } else if (streak > 0) {
                return `<span class="streak-indicator">${streak}/${days.length} 🔥</span>`;
            }
            return '';
        }

        function renderDayCard(day) {
            const data = studyData[day.day] || { completed: false, icons: {} };
            const isCompleted = data.completed;
            
            if (day.subjects[0]?.isRevision) {
                return `
                    <div class="day-card revision-day ${isCompleted ? 'completed' : ''}" data-day="${day.day}">
                        <div class="day-header">
                            <span class="day-number">DIA ${day.day}</span>
                            <div class="day-check ${isCompleted ? 'checked' : ''}" onclick="toggleDay(${day.day})"></div>
                        </div>
                        <div class="subjects-list">
                            <div class="subject-item">
                                <div class="subject-name">${day.subjects[0].name}</div>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            return `
                <div class="day-card ${isCompleted ? 'completed' : ''}" data-day="${day.day}">
                    <div class="day-header">
                        <span class="day-number">DIA ${day.day}</span>
                        <div class="day-check ${isCompleted ? 'checked' : ''}" onclick="toggleDay(${day.day})"></div>
                    </div>
                    <div class="subjects-list">
                        ${day.subjects.map((subject, sIndex) => `
                            <div class="subject-item">
                                <div class="subject-name">${subject.name}</div>
                                <div class="subject-icons">
                                    ${subject.icons.map(icon => {
                                        const count = data.icons?.[`${sIndex}-${icon}`] || 0;
                                        return `
                                            <button class="icon-btn ${icon} ${count > 0 ? 'active' : ''}" 
                                                    onclick="incrementIcon(${day.day}, ${sIndex}, '${icon}')"
                                                    onmouseenter="showTooltip(event, '${getIconLabel(icon)}')"
                                                    onmouseleave="hideTooltip()">
                                                ${getIconSymbol(icon)}
                                                <span class="count-badge">${count}</span>
                                            </button>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function getIconSymbol(type) {
            const symbols = {
                video: '▶',
                book: '📖',
                quiz: '?'
            };
            return symbols[type] || type;
        }

        function getIconLabel(type) {
            const labels = {
                video: 'Assistir Videoaula',
                book: 'Ler Material',
                quiz: 'Fazer Questões'
            };
            return labels[type];
        }

        function toggleDay(day) {
            if (!studyData[day]) {
                studyData[day] = { completed: false, icons: {} };
            }
            studyData[day].completed = !studyData[day].completed;
            
            if (studyData[day].completed) {
                createConfetti();
            }
            
            saveData();
            refreshUI();
        }

        function incrementIcon(day, subjectIndex, iconType) {
            if (!studyData[day]) {
                studyData[day] = { completed: false, icons: {} };
            }
            
            const key = `${subjectIndex}-${iconType}`;
            studyData[day].icons[key] = (studyData[day].icons[key] || 0) + 1;
            
            saveData();
            refreshUI();
        }

        function saveData() {
            localStorage.setItem('inssStudyData', JSON.stringify(studyData));
        }

        function refreshUI() {
            document.getElementById('weeksContainer').innerHTML = '';
            renderSchedule();
            updateStats();
        }

        function updateStats() {
            const allDays = scheduleData.flatMap(w => w.days);
            const completedDays = allDays.filter(d => studyData[d.day]?.completed).length;
            const totalSessions = Object.values(studyData).reduce((acc, day) => {
                return acc + Object.values(day.icons || {}).reduce((a, b) => a + b, 0);
            }, 0);
            
            // Calcular streak
            let currentStreak = 0;
            const sortedDays = Object.keys(studyData)
                .filter(k => studyData[k].completed)
                .map(Number)
                .sort((a, b) => b - a);
            
            if (sortedDays.length > 0) {
                currentStreak = 1;
                for (let i = 1; i < sortedDays.length; i++) {
                    if (sortedDays[i-1] - sortedDays[i] === 1) {
                        currentStreak++;
                    } else {
                        break;
                    }
                }
            }
            
            const completionRate = Math.round((completedDays / allDays.length) * 100);
            
            animateNumber('totalDays', completedDays);
            animateNumber('totalSessions', totalSessions);
            animateNumber('currentStreak', currentStreak);
            animateNumber('completionRate', completionRate, '%');
        }

        function animateNumber(id, value, suffix = '') {
            const element = document.getElementById(id);
            const start = parseInt(element.textContent) || 0;
            const end = value;
            const duration = 1000;
            const startTime = performance.now();
            
            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                const current = Math.round(start + (end - start) * easeProgress);
                element.textContent = current + suffix;
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            
            requestAnimationFrame(update);
        }

        function createConfetti() {
            const colors = ['#fbbf24', '#10b981', '#3b82f6', '#ef4444', '#8b5cf6'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 4000);
            }
        }

        function setupTooltip() {
            const tooltip = document.getElementById('tooltip');
            window.showTooltip = (e, text) => {
                tooltip.textContent = text;
                tooltip.style.opacity = '1';
                tooltip.style.left = e.clientX + 10 + 'px';
                tooltip.style.top = e.clientY - 30 + 'px';
            };
            window.hideTooltip = () => {
                tooltip.style.opacity = '0';
            };
        }

        function confirmReset() {
            document.getElementById('resetModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('resetModal').classList.remove('active');
        }

        function resetProgress() {
            studyData = {};
            localStorage.removeItem('inssStudyData');
            closeModal();
            refreshUI();
        }

        function scrollToToday() {
            // Simular "hoje" baseado no progresso ou ir para o primeiro não completado
            const allDays = scheduleData.flatMap(w => w.days);
            const nextDay = allDays.find(d => !studyData[d.day]?.completed) || allDays[0];
            const element = document.querySelector(`[data-day="${nextDay.day}"]`);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                element.style.animation = 'pulse 1s';
                setTimeout(() => element.style.animation = '', 1000);
            }
        }

        // Fechar modal ao clicar fora
        document.getElementById('resetModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });
    </script>
</body>
</html>
