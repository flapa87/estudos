<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direito Constitucional - INSS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 30px;
            color: white;
            text-decoration: none;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: translateX(-5px);
        }

        header {
            background: white;
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .icone {
            font-size: 4em;
            margin-bottom: 20px;
        }

        header h1 {
            color: #1e3c72;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .conteudo {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            min-height: 300px;
        }

        /* Estilo do botão de link */
        .tema-link {
            display: block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            padding: 25px 30px;
            border-radius: 15px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
        }

        .tema-link:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }

        .tema-content {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .tema-icone {
            font-size: 2.5em;
        }

        .tema-info h3 {
            font-size: 1.4em;
            margin-bottom: 5px;
        }

        .tema-info p {
            opacity: 0.9;
            font-size: 0.95em;
        }

        .tema-arrow {
            margin-left: auto;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="inss.html" class="back-btn">← Voltar para INSS</a>

        <header>
            <div class="icone">📜</div>
            <h1>Direito Constitucional</h1>
        </header>

        <div class="conteudo">
            <!-- NOVO BOTÃO: Direitos e Garantias Individuais e Coletivos -->
            <a href="constitucional1.html" class="tema-link">
                <div class="tema-content">
                    <span class="tema-icone">⚖️</span>
                    <div class="tema-info">
                        <h3>Direitos e Garantias Individuais e Coletivos</h3>
                        <p>Clique para acessar o conteúdo sobre Direitos e Garantias Fundamentais</p>
                    </div>
                    <span class="tema-arrow">→</span>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
