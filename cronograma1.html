<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palhoça Pro - Ultra Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --accent: #7c3aed;
            --accent-light: #a78bfa;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background Decor */
        .blob {
            position: fixed;
            width: 500px;
            height: 500px;
            background: var(--accent);
            filter: blur(150px);
            opacity: 0.15;
            z-index: -1;
            border-radius: 50%;
        }

        /* Container */
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header Section */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 60px;
        }

        .brand h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, #fff, var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        .brand p { color: var(--text-dim); font-size: 1.2rem; margin: 10px 0 0; }

        /* Progress Dashboard */
        .dashboard {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr;
            gap: 25px;
            margin-bottom: 50px;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .stat-label { color: var(--text-dim); font-weight: 600; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 2.5rem; font-weight: 800; margin: 15px 0; display: block; }

        .progress-track {
            height: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #3b82f6);
            width: 0%;
            transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
        }

        /* Week Navigation */
        .week-nav {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            padding: 10px;
            background: var(--glass);
            border-radius: 20px;
            width: fit-content;
        }

        .week-btn {
            padding: 12px 24px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-family: inherit;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 14px;
            transition: 0.3s;
        }

        .week-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 10px 20px rgba(124, 58, 237, 0.3);
        }

        /* Timeline Content */
        .timeline {
            display: grid;
            gap: 30px;
        }

        .day-section {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 30px;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.5s forwards;
        }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        .day-label {
            text-align: right;
            padding-top: 10px;
        }

        .day-name { font-weight: 800; font-size: 1.2rem; color: var(--accent-light); display: block; }
        .day-dot { 
            width: 12px; height: 12px; background: var(--accent); border-radius: 50%; 
            display: inline-block; margin-top: 10px; box-shadow: 0 0 10px var(--accent);
        }

        .topics-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .topic-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
        }

        .topic-card:hover {
            background: rgba(255,255,255,0.06);
            transform: scale(1.02);
            border-color: var(--accent-light);
        }

        .topic-card.completed {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.05);
        }

        .topic-card.completed::after {
            content: '✓';
            position: absolute;
            top: 20px;
            right: 20px;
            color: var(--success);
            font-weight: 800;
            font-size: 1.2rem;
        }

        .subject-tag {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-light);
            margin-bottom: 10px;
            display: block;
        }

        .topic-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; display: block; }
        .topic-desc { font-size: 0.9rem; color: var(--text-dim); line-height: 1.6; }

        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--glass-border);
        }

        .view-pill {
            background: rgba(255,255,255,0.05);
            padding: 6px 12px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .view-btn {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0 5px;
        }

        .view-btn:hover { color: var(--accent-light); }

        /* Mobile Adjustments */
        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
            .day-section { grid-template-columns: 1fr; gap: 10px; }
            .day-label { text-align: left; }
            .brand h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

<div class="blob" style="top: -100px; right: -100px;"></div>
<div class="blob" style="bottom: -100px; left: -100px; background: #3b82f6;"></div>

<div class="app-container">
    <header>
        <div class="brand">
            <h1>Palhoça Pro</h1>
            <p>Técnico Legislativo • Edital 2026</p>
        </div>
        <div style="text-align: right">
            <span id="dateDisplay" style="font-weight: 600; color: var(--accent-light);"></span>
        </div>
    </header>

    <div class="dashboard">
        <div class="glass-card">
            <span class="stat-label">Domínio do Edital</span>
            <span class="stat-value" id="mainPercent">0%</span>
            <div class="progress-track"><div class="progress-fill" id="mainBar"></div></div>
        </div>
        <div class="glass-card">
            <span class="stat-label">Concluídos</span>
            <span class="stat-value" id="doneCount">0</span>
            <span style="color: var(--text-dim)">de <span id="totalCount">0</span> tópicos</span>
        </div>
        <div class="glass-card">
            <span class="stat-label">Nível de Revisão</span>
            <span class="stat-value" id="totalViews">0</span>
            <span style="color: var(--text-dim)">Pontos de XP</span>
        </div>
    </div>

    <div class="week-nav" id="weekNav"></div>

    <div class="timeline" id="timeline"></div>
</div>

<script>
    const schedule = [
        {
            week: "W1", label: "Semana 1",
            days: [
                { name: "SEG", items: [
                    { sub: "Português", title: "Interpretação de Texto", desc: "Tipologia e compreensão textual." },
                    { sub: "Dir. Const.", title: "Artigo 5º da CF", desc: "Direitos e deveres individuais e coletivos." }
                ]},
                { name: "TER", items: [
                    { sub: "RLM", title: "Lógica Proposicional", desc: "Conectivos e Tabela Verdade." },
                    { sub: "Dir. Admin.", title: "Princípios da Adm.", desc: "LIMPE (Legalidade, Impessoalidade, Moralidade, Publicidade e Eficiência)." }
                ]},
                { name: "QUA", items: [
                    { sub: "Informática", title: "Windows e Segurança", desc: "Windows 10/11 e Segurança da Informação." },
                    { sub: "Legis. Mun.", title: "Lei Orgânica", desc: "Disposições Preliminares de Palhoça." }
                ]},
                { name: "QUI", items: [
                    { sub: "Português", title: "Ortografia", desc: "Acentuação e regras ortográficas." },
                    { sub: "Dir. Const.", title: "Organização do Estado", desc: "Administração Pública (Art. 37 a 41 da CF)." }
                ]},
                { name: "SEX", items: [
                    { sub: "Atualidades", title: "Cenário Nacional", desc: "Fatos políticos e econômicos recentes no Brasil." },
                    { sub: "Dir. Admin.", title: "Org. Administrativa", desc: "Administração Direta e Indireta." }
                ]}
            ]
        },
        {
            week: "W2", label: "Semana 2",
            days: [
                { name: "SEG", items: [
                    { sub: "Português", title: "Morfologia", desc: "Classes de palavras (Verbos e Substantivos)." },
                    { sub: "Dir. Const.", title: "Poder Legislativo", desc: "Estrutura e funcionamento geral." }
                ]},
                { name: "TER", items: [
                    { sub: "RLM", title: "Diagramas Lógicos", desc: "Quantificadores (Todo, Algum, Nenhum)." },
                    { sub: "Dir. Admin.", title: "Agentes Públicos", desc: "Tipos de agentes e Improbidade Adm." }
                ]},
                { name: "QUA", items: [
                    { sub: "Informática", title: "I.A. Generativa", desc: "Copilot, Gemini e Ética (Edital 2026)." },
                    { sub: "Legis. Mun.", title: "Estatuto Servidores", desc: "Direitos, deveres e regime disciplinar." }
                ]},
                { name: "QUI", items: [
                    { sub: "Português", title: "Sintaxe", desc: "Estrutura da oração e complementos." },
                    { sub: "Rotinas Adm.", title: "Gestão Documental", desc: "Arquivamento e Protocolo." }
                ]},
                { name: "SEX", items: [
                    { sub: "Proc. Legis.", title: "Espécies Normativas", desc: "Emendas, Leis e Resoluções." },
                    { sub: "Dir. Admin.", title: "Poderes Administrat.", desc: "Poder Hierárquico e de Polícia." }
                ]}
            ]
        },
        {
            week: "W3", label: "Semana 3",
            days: [
                { name: "SEG", items: [
                    { sub: "Português", title: "Concordância", desc: "Concordância Verbal e Nominal." },
                    { sub: "Redação Ofic.", title: "Padrão Ofício", desc: "Manual da Presidência e Atas." }
                ]},
                { name: "TER", items: [
                    { sub: "Matemática", title: "Finanças", desc: "Porcentagem e Juros Simples." },
                    { sub: "Dir. Admin.", title: "Atos Administrativos", desc: "Requisitos e Atributos do Ato." }
                ]},
                { name: "QUA", items: [
                    { sub: "Informática", title: "MS Word 365", desc: "Abas, atalhos e tabelas." },
                    { sub: "Legis. Mun.", title: "Regimento Interno", desc: "Mesa Diretora e Vereadores." }
                ]},
                { name: "QUI", items: [
                    { sub: "Português", title: "Crase", desc: "Regência verbal e emprego da crase." },
                    { sub: "Ouvidoria", title: "Lei 13.460/2017", desc: "Defesa do Usuário do Serviço Público." }
                ]},
                { name: "SEX", items: [
                    { sub: "Dir. Admin.", title: "Licitações", desc: "Lei 14.133/21: Modalidades e Dispensa." },
                    { sub: "Proc. Legis.", title: "Fases Processuais", desc: "Tramitação e votação na Câmara." }
                ]}
            ]
        },
        {
            week: "W4", label: "Semana 4",
            days: [
                { name: "SEG", items: [
                    { sub: "Português", title: "Pontuação", desc: "Uso da vírgula e ponto-e-vírgula." },
                    { sub: "Redação Ofic.", title: "Comunicação", desc: "Pronomes de Tratamento." }
                ]},
                { name: "TER", items: [
                    { sub: "Matemática", title: "Combinatória", desc: "Análise Combinatória e Probabilidade." },
                    { sub: "Dir. Admin.", title: "Desfazimento Atos", desc: "Anulação e Revogação." }
                ]},
                { name: "QUA", items: [
                    { sub: "Informática", title: "MS Excel 365", desc: "Fórmulas básicas (SOMA, SE)." },
                    { sub: "Legis. Mun.", title: "Regimento Interno", desc: "Comissões e Sessões." }
                ]},
                { name: "QUI", items: [
                    { sub: "Português", title: "Coesão", desc: "Conjunções e conectivos." },
                    { sub: "Transparência", title: "L.A.I.", desc: "Lei de Acesso à Informação." }
                ]},
                { name: "SEX", items: [
                    { sub: "Rotinas Adm.", title: "Atendimento", desc: "Ética e Relacionamento com Cidadão." },
                    { sub: "Atualidades", title: "Tecnologia", desc: "Temas globais relevantes." }
                ]}
            ]
        },
        {
            week: "W5", label: "Semana 5",
            days: [
                { name: "SEG", items: [
                    { sub: "Português", title: "Semântica", desc: "Sinônimos e Ambiguidade." },
                    { sub: "Dir. Const.", title: "Fiscalização", desc: "Controle Financeiro." }
                ]},
                { name: "TER", items: [
                    { sub: "Dir. Admin.", title: "Serviços Públicos", desc: "Concessão e Responsabilidade Civil." },
                    { sub: "RLM", title: "Sequências", desc: "Padrões numéricos e figuras." }
                ]},
                { name: "QUA", items: [
                    { sub: "Informática", title: "Navegadores", desc: "Chrome, Edge e Nuvem." },
                    { sub: "Legis. Mun.", title: "Revisão Geral", desc: "Lei Orgânica e Estatuto." }
                ]},
                { name: "QUI", items: [
                    { sub: "Redação Ofic.", title: "Prática", desc: "Ofícios e Requerimentos." },
                    { sub: "Rotinas Adm.", title: "Procedimentos", desc: "Processos Adm. e Protocolo." }
                ]},
                { name: "SEX", items: [
                    { sub: "Simulado", title: "Simulado Final", desc: "70 Questões - Estilo FUNDATEC" }
                ]}
            ]
        }
    ];

    let activeWeek = 0;
    let progress = JSON.parse(localStorage.getItem('palhoca_ultra_v1')) || {};

    function init() {
        document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
        renderNav();
        renderTimeline();
        updateStats();
    }

    function renderNav() {
        const nav = document.getElementById('weekNav');
        nav.innerHTML = '';
        schedule.forEach((w, idx) => {
            const btn = document.createElement('button');
            btn.className = `week-btn ${idx === activeWeek ? 'active' : ''}`;
            btn.textContent = w.label;
            btn.onclick = () => {
                activeWeek = idx;
                renderNav();
                renderTimeline();
            };
            nav.appendChild(btn);
        });
    }

    function renderTimeline() {
        const container = document.getElementById('timeline');
        container.innerHTML = '';
        const week = schedule[activeWeek];

        week.days.forEach((day, dIdx) => {
            const section = document.createElement('div');
            section.className = 'day-section';
            section.style.animationDelay = `${dIdx * 0.1}s`;

            let topicsHtml = '';
            day.items.forEach((item, iIdx) => {
                const id = `w${activeWeek}d${dIdx}i${iIdx}`;
                const state = progress[id] || { done: false, views: 0 };
                
                topicsHtml += `
                    <div class="topic-card ${state.done ? 'completed' : ''}" onclick="toggleTopic('${id}', event)">
                        <span class="subject-tag">${item.sub}</span>
                        <span class="topic-name">${item.title}</span>
                        <p class="topic-desc">${item.desc}</p>
                        <div class="card-actions">
                            <div class="view-pill" onclick="event.stopPropagation()">
                                <button class="view-btn" onclick="updateView('${id}', -1)">-</button>
                                <span>${state.views} revisões</span>
                                <button class="view-btn" onclick="updateView('${id}', 1)">+</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            section.innerHTML = `
                <div class="day-label">
                    <span class="day-name">${day.name}</span>
                    <div class="day-dot"></div>
                </div>
                <div class="topics-container">${topicsHtml}</div>
            `;
            container.appendChild(section);
        });
    }

    function updateStats() {
        let total = 0, done = 0, views = 0;
        schedule.forEach((w, wIdx) => {
            w.days.forEach((d, dIdx) => {
                d.items.forEach((i, iIdx) => {
                    total++;
                    const id = `w${wIdx}d${dIdx}i${iIdx}`;
                    if (progress[id]) {
                        if (progress[id].done) done++;
                        views += progress[id].views;
                    }
                });
            });
        });

        const percent = Math.round((done / total) * 100);
        document.getElementById('mainPercent').textContent = percent + '%';
        document.getElementById('mainBar').style.width = percent + '%';
        document.getElementById('doneCount').textContent = done;
        document.getElementById('totalCount').textContent = total;
        document.getElementById('totalViews').textContent = views * 10; // XP Factor

        if (percent === 100) {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        }
    }

    window.toggleTopic = (id, event) => {
        if (!progress[id]) progress[id] = { done: false, views: 0 };
        progress[id].done = !progress[id].done;
        if (progress[id].done) {
            confetti({ particleCount: 40, spread: 50, origin: { x: event.clientX / window.innerWidth, y: event.clientY / window.innerHeight } });
        }
        save();
    };

    window.updateView = (id, delta) => {
        if (!progress[id]) progress[id] = { done: false, views: 0 };
        progress[id].views = Math.max(0, progress[id].views + delta);
        save();
    };

    function save() {
        localStorage.setItem('palhoca_ultra_v1', JSON.stringify(progress));
        renderTimeline();
        updateStats();
    }

    init();
</script>

</body>
</html>
