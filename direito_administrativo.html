<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direito Administrativo - INSS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .back-btn {
            display: inline-block;
            margin-bottom: 30px;
            color: white;
            text-decoration: none;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            transform: translateX(-5px);
        }
        
        header {
            background: white;
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .icone {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        header h1 {
            color: #1e3c72;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .conteudo {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            min-height: 300px;
        }

        /* Animações de Transição Profissionais */
        .page-transition {
            animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }
        
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        /* Efeito de saída suave */
        body.fade-out {
            animation: fadeOut 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateY(-30px);
                filter: blur(10px);
            }
        }
        
        /* Container com animação */
        .container {
            animation: scaleIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Transições suaves em todos elementos */
        * {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        
        /* Header com animação especial */
        header {
            animation: fadeInUp 0.7s cubic-bezier(0.4, 0, 0.2, 1) 0.1s backwards;
        }
        
        /* Ícone com bounce */
        .icone {
            animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3) rotate(-180deg);
            }
            50% {
                transform: scale(1.1) rotate(10deg);
            }
            70% {
                transform: scale(0.9) rotate(-5deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }

        /* Link da Prova 01 */
        .prova-link {
            display: block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            padding: 25px 30px;
            border-radius: 15px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
            animation: slideInRight 0.6s ease-out;
        }
        
        .prova-link:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }
        
        .prova-content {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .prova-icone {
            font-size: 2.5em;
        }
        
        .prova-info h3 {
            font-size: 1.4em;
            margin-bottom: 5px;
        }
        
        .prova-info p {
            opacity: 0.9;
            font-size: 0.95em;
        }
        
        .prova-arrow {
            margin-left: auto;
            font-size: 1.5em;
        }
        
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(60px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body class="page-transition">
    <div class="container">
        <a href="inss.html" class="back-btn">← Voltar para INSS</a>
        
        <header>
            <div class="icone">🏛️</div>
            <h1>Direito Administrativo</h1>
        </header>
        
        <div class="conteudo">
            <!-- Link para Prova 01 -->
            <a href="administrativo1.html" class="prova-link">
                <div class="prova-content">
                    <span class="prova-icone">📝</span>
                    <div class="prova-info">
                        <h3>Prova 01</h3>
                        <p>Clique para acessar a primeira prova de Direito Administrativo</p>
                    </div>
                    <span class="prova-arrow">→</span>
                </div>
            </a>

            <!-- NOVO BOTÃO: Regime jurídico dos servidores públicos federais -->
            <a href="administrativo2.html" class="prova-link">
                <div class="prova-content">
                    <span class="prova-icone">👔</span>
                    <div class="prova-info">
                        <h3>Regime jurídico dos servidores públicos federais</h3>
                        <p>Clique para acessar o conteúdo sobre o Regime jurídico dos servidores públicos federais</p>
                    </div>
                    <span class="prova-arrow">→</span>
                </div>
            </a>
        </div>
    </div>

    <script>
        // Transição suave ao navegar
        document.querySelectorAll('a[href^="index"], a[href^="inss"], a[href^="portugues"], a[href^="direito"], a[href^="etica"], a[href^="raciocinio"], a[href^="informatica"], a[href^="previdenciario"], a[href^="administrativo"]').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const href = this.getAttribute('href');
                
                // Adiciona classe de saída
                document.body.style.opacity = '0';
                document.body.style.transform = 'translateY(-20px)';
                document.body.style.filter = 'blur(10px)';
                document.body.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                
                setTimeout(() => {
                    window.location.href = href;
                }, 400);
            });
        });
        
        // Animação de entrada ao carregar
        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('page-transition');
        });
    </script>
</body>
</html>
